name: Release

# Tagging `v1.2.3` builds installers on all three platforms and publishes them
# to a GitHub release. That release is also the feed electron-updater reads, so
# publishing here is what makes in-app auto-update work.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # node-pty resolves `@lydell/node-pty-${platform}-${arch}` at run
            # time, so a cross-arch installer needs that arch's binary present
            # at package time or its terminal silently degrades to pipes.
            pty: '@lydell/node-pty-win32-x64 @lydell/node-pty-win32-arm64'
          - os: macos-latest
            pty: '@lydell/node-pty-darwin-x64 @lydell/node-pty-darwin-arm64'
          - os: ubuntu-latest
            pty: '@lydell/node-pty-linux-x64 @lydell/node-pty-linux-arm64'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--force` is required: these packages declare os/cpu constraints that do
      # not match the runner we are cross-building from.
      - name: Add cross-arch pty binaries
        run: npm install --no-save --force ${{ matrix.pty }}

      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke tests
        run: npm run smoke

      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: signing needs certificates this repo does not have.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release

  # The three builds upload into a draft. Publishing only after all of them
  # succeed makes the release atomic: without this, GitHub reports it as the
  # latest release the moment the first platform starts uploading, and every
  # app checking for updates in that window fetches a latest.yml that is not
  # there yet and fails with a 404.
  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Verify the update feeds arrived, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"

          # An update feed per platform, or auto-update silently breaks for it.
          for feed in latest.yml latest-mac.yml latest-linux.yml; do
            grep -qx "$feed" <<<"$assets" || {
              echo "::error::$feed is missing — refusing to publish a half-built release"
              exit 1
            }
          done

          gh release edit "$TAG" --draft=false --latest
