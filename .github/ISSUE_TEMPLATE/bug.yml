name: Bug report
description: Report reproducible incorrect behaviour
body:
  - type: input
    id: version
    attributes: { label: Forge version }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Operating system and version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behaviour }
    validations: { required: true }
